---
kind: pipeline
name: build and publish co-op cloud wizard
steps:
  - name: build and publish image
    image: plugins/docker@sha256:66da659242f140949e61dc315208f517bf3d6a589e8b72e6685df706c660523c
    settings:
      auto_tag: true
      username:
        from_secret: docker_username
      password:
        from_secret: docker_password
      repo: git.coopcloud.tech/toolshed/coop-cloud-backend
      registry: git.coopcloud.tech

trigger:
  event:
  - push
  - tag
  branch:
  - main
